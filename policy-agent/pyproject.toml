[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "uavguard-policy-agent"
version = "0.1.0"
description = "Standalone UAVGuard Policy Agent implemented as a PDP-style drone flight authorization service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.14.0",
    "pypdf>=4.3.0",
    "python-dotenv>=1.0.1",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
vector = [
    "chromadb>=0.5.5",
]
dev = [
    "mypy>=2.3.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["policy_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
ignore = ["B008", "B019", "B905", "E402", "E501"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
strict_optional = true
check_untyped_defs = true
exclude = ["^\\.python_packages/"]
